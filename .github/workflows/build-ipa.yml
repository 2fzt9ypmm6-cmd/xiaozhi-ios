name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download YbridOpus
        run: |
          mkdir -p ../Downloads
          cd ../Downloads
          curl -L -o YbridOpus.xcframework.zip https://github.com/ybrid/opus-swift/releases/download/0.8.0/YbridOpus.xcframework.zip
          unzip YbridOpus.xcframework.zip
          ls -la

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build
        run: |
          cd xiaozhi.xcodeproj/..
          xcodebuild -project xiaozhi.xcodeproj -scheme xiaozhi -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          cd build/Build/Products/Release-iphoneos
          mkdir Payload
          cp -r xiaozhi.app Payload/
          zip -r xiaozhi.ipa Payload
          mv xiaozhi.ipa $GITHUB_WORKSPACE/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi-ipa
          path: xiaozhi.ipa
